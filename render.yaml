# Render Blueprint: API (Docker) + PostgreSQL. The UI is deployed on Vercel (see docs/DEPLOY.md).
databases:
  - name: gamota-copilot-db
    databaseName: copilot
    plan: free

services:
  - type: web
    name: gamota-copilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gamota-copilot-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false          # set in the Render dashboard, never commit
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free   # change here later; the :free endpoint logs usage
      - key: LLM_TEMPERATURE
        value: "0"
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL, e.g. https://your-app.vercel.app
